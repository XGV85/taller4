<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectar · ¿Ayuda o daña?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
  .proy-main { grid-template-rows: auto 1fr; }
  .tarjeta .x { margin-left: 10px; border: 0; background: none; color: inherit; opacity: .45; font-size: 1rem; }
  .tarjeta .x:hover { opacity: 1; }
  .espera { text-align: center; font-size: 1.3rem; color: var(--gris); margin-top: 18px; }
</style>
</head>
<body>
<main class="proy-main" id="vista"></main>

<script src="../datos.js"></script>
<script src="../comun.js"></script>
<script src="proy.js"></script>
<script>
const L = T4.frases.lista;
const porPersona = new Map();          // u → {v, r}
const ocultas = new Set(JSON.parse(localStorage.getItem("t4-ocultas-frases") || "[]"));
const destacadas = new Set();
let actual = 0;                        // 0..7 = frase; 8 = resumen
const vistas = new Set();              // frases con resultados visibles
let pendiente = false;

function conteo(i) {
  let a = 0, d = 0;
  for (const p of porPersona.values()) {
    if (p.v && p.v[i] === "a") a++;
    if (p.v && p.v[i] === "d") d++;
  }
  return { a, d, t: a + d };
}
const pct = (n, t) => t ? Math.round(100 * n / t) : 0;

function vistaFrase(i) {
  const f = L[i], c = conteo(i), ver = vistas.has(i);
  const reesc = [];
  porPersona.forEach((p, u) => {
    const t = p.r && p.r[i];
    const clave = u + ":" + i;
    if (t && !ocultas.has(clave)) reesc.push({ t, clave });
  });
  return `
    <section class="panel">
      <div class="frase-num">FRASE ${i + 1} DE ${L.length}</div>
      <p class="frase-grande">${esc(f.t)}</p>
      ${ver ? `
        <div class="duo">
          <div class="caja a${f.r === "a" ? " correcta" : ""}"><div class="pct">${pct(c.a, c.t)}%</div>Ayuda · ${c.a}</div>
          <div class="caja d${f.r === "d" ? " correcta" : ""}"><div class="pct">${pct(c.d, c.t)}%</div>Daña · ${c.d}</div>
        </div>
        <p class="coment">${esc(f.c)}</p>`
      : `<p class="espera">${c.t} ${c.t === 1 ? "respuesta" : "respuestas"} · pulse «Ver resultados» (tecla R)</p>`}
    </section>
    ${f.r === "d" && ver ? `
    <section class="panel">
      <h2>Así la dirían ustedes (${reesc.length})</h2>
      <div class="tarjetas">${reesc.length ? reesc.map(x =>
        `<div class="tarjeta${destacadas.has(x.clave) ? " destacada" : ""}" data-k="${esc(x.clave)}">${esc(x.t)}<button class="x" data-o="${esc(x.clave)}" title="Ocultar">✕</button></div>`).join("")
        : '<p class="vacio">Sin frases reescritas todavía.</p>'}</div>
      <p class="leyenda" style="margin-top:10px">Clic en una tarjeta para destacarla · ✕ para ocultarla.</p>
    </section>` : ""}`;
}

function vistaResumen() {
  return `<section class="panel" style="grid-row: span 2">
    <h2>Resumen de las 8 frases</h2>
    <table class="res-tabla">${L.map((f, i) => {
      const c = conteo(i);
      return `<tr><td style="color:var(--dorado);font-weight:800">${i + 1}</td>
        <td>${esc(f.t)}</td>
        <td style="width:34%"><div class="mini"><span class="a" style="width:${pct(c.a, c.t)}%"></span><span class="d" style="width:${pct(c.d, c.t)}%"></span></div></td>
        <td style="white-space:nowrap">${pct(c.a, c.t)}% ayuda · ${pct(c.d, c.t)}% daña</td>
        <td style="font-weight:700;color:${f.r === "a" ? "var(--verde)" : "var(--guinda)"}">${f.r === "a" ? "Ayuda" : "Daña"}</td></tr>`;
    }).join("")}</table>
    <p class="coment" style="margin-top:22px">Creerle, no culparla y respetar sus decisiones.</p>
  </section>`;
}

function pintar() {
  pendiente = false;
  ui.contador(porPersona.size);
  document.getElementById("vista").innerHTML = actual < L.length ? vistaFrase(actual) : vistaResumen();
  document.getElementById("b-ver").classList.toggle("activo", vistas.has(actual));
  document.getElementById("b-res").classList.toggle("activo", actual === L.length);
}
const pedir = () => { if (!pendiente) { pendiente = true; requestAnimationFrame(pintar); } };

const ui = marco("frases", T4.frases.titulo, d => { porPersona.set(d.u, d); pedir(); }, `
  <button class="ctrl" id="b-ant" title="Flecha izquierda">◀ Anterior</button>
  <button class="ctrl" id="b-ver" title="Tecla R">Ver resultados</button>
  <button class="ctrl" id="b-sig" title="Flecha derecha">Siguiente ▶</button>
  <button class="ctrl" id="b-res">Resumen</button>`);

const mover = n => { actual = Math.max(0, Math.min(L.length, actual + n)); pintar(); };
const verRes = () => { if (actual < L.length) { vistas.has(actual) ? vistas.delete(actual) : vistas.add(actual); pintar(); } };
document.getElementById("b-ant").onclick = () => mover(-1);
document.getElementById("b-sig").onclick = () => mover(1);
document.getElementById("b-ver").onclick = verRes;
document.getElementById("b-res").onclick = () => { actual = L.length; pintar(); };
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") mover(1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") mover(-1);
  if (e.key === "r" || e.key === "R") verRes();
});
document.getElementById("vista").addEventListener("click", e => {
  const o = e.target.closest("[data-o]");
  if (o) {
    ocultas.add(o.dataset.o);
    localStorage.setItem("t4-ocultas-frases", JSON.stringify([...ocultas]));
    return pintar();
  }
  const t = e.target.closest(".tarjeta");
  if (t) { destacadas.has(t.dataset.k) ? destacadas.delete(t.dataset.k) : destacadas.add(t.dataset.k); pintar(); }
});
pintar();
</script>
</body>
</html>
